name: Secret scan

# Repo-local variant of the estate secret-scan gate. The shared
# seolith-dev-standards callers cannot be used here: this repo is PUBLIC and
# public repos cannot instantiate reusable workflows from the PRIVATE
# dev-standards repo (GitHub restriction, verified 2026-09-05).
#
# Scans FULL HISTORY on every run (repo is tiny) so already-committed secrets
# surface immediately. If this fails, ROTATE the credential -- deleting the
# file leaves it in history and in every clone.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_ENABLE_SUMMARY: "true"
