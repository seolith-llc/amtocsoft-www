name: Secret scan

# Thin caller over seolith-dev-standards. Added estate-wide 2026-07-28 after a
# sweep found 70 of 72 active repos with no secret-scanning gate, and real
# credentials committed for months in two of them.
#
# fetch-depth 0 on first adoption: it scans FULL HISTORY, so the first run tells
# you what is already committed. If this run fails, the fix is to ROTATE the
# credential -- deleting the file leaves it in history and in every clone.
# Once clean, drop to fetch-depth: 1 to gate only new commits.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    uses: seolith-llc/seolith-dev-standards/.github/workflows/secret-scan.yml@2b6fad978ae3f98e824cd2210438b03a503c1444 # v1.1.4
    with:
      # Linux, deliberately, even though this repo builds on Windows.
      # A secret scan reads files -- it does not need to match the build OS.
      # The single Windows runner is the estate's throughput bottleneck, and
      # routing scans there queued 45 jobs behind it for no benefit.
      runs-on: '["self-hosted","Linux","X64","seolith-local","linux-build"]'
