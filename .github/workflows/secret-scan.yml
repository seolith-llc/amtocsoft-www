name: Secret scan

# Repo-local variant of the estate secret-scan gate. The shared
# seolith-dev-standards callers cannot be used here: this repo is PUBLIC and
# public repos cannot instantiate reusable workflows from the PRIVATE
# dev-standards repo (GitHub restriction, verified 2026-09-05). Uses the
# gitleaks CLI directly -- the gitleaks-action marketplace step requires an
# organization license key.
#
# Scans FULL HISTORY on every run (repo is tiny) so already-committed secrets
# surface immediately. If this fails, ROTATE the credential -- deleting the
# file leaves it in history and in every clone.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks version
      - name: Scan full history
        run: |
          set -euo pipefail
          ./gitleaks git --verbose .
