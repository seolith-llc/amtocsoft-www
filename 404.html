<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | AmtocSoft</title>
  <meta name="description" content="The page you are looking for does not exist. Head back to the AmtocSoft home page.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    html,body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", sans-serif;
      background: radial-gradient(ellipse at top left, #1a1033 0%, #0a0518 50%, #000 100%);
      color: #f0e8d0;
      min-height: 100vh;
      line-height: 1.7;
      display: flex;
      flex-direction: column;
    }
    .nav {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(139, 92, 246, 0.15);
    }
    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav a.logo {
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      text-decoration: none;
      letter-spacing: -0.01em;
    }
    .nav a.logo span {
      background: linear-gradient(135deg, #ec4899, #8b5cf6 50%, #f97316);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 24px 96px;
    }
    .code {
      font-size: clamp(72px, 15vw, 140px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ec4899, #8b5cf6 50%, #f97316);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 17px;
      color: #c8b8e0;
      max-width: 480px;
      margin-bottom: 36px;
    }
    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-primary {
      display: inline-block;
      background: linear-gradient(135deg, #ec4899, #8b5cf6 50%, #f97316);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 100px;
    }
    .btn-outline {
      display: inline-block;
      border: 1px solid rgba(139, 92, 246, 0.5);
      color: #d4c5f0;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 100px;
    }
    .btn-outline:hover { color: #ec4899; border-color: #ec4899; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="logo" href="/"><span>AmtocSoft</span></a>
    </div>
  </nav>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p class="subtitle">The page you are looking for doesn't exist or may have moved. Let's get you back on track.</p>
    <div class="actions">
      <a class="btn-primary" href="/">Back to Home</a>
      <a class="btn-outline" href="/#pricing">See the Kit</a>
    </div>
  </main>
</body>
</html>
